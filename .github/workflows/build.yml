name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Create project files
        run: |
          mkdir -p src/main/java/com/example/anglelevel
          mkdir -p src/main/res/drawable src/main/res/mipmap-anydpi src/main/res/mipmap-anydpi-v26
          cat > settings.gradle.kts <<'END'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              plugins {
                  id("com.android.application") version "8.5.2"
                  id("org.jetbrains.kotlin.android") version "1.9.24"
              }
          }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Level"
          END
          cat > build.gradle.kts <<'END'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.anglelevel"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.anglelevel"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          END
          cat > src/main/AndroidManifest.xml <<'END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Рівень"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          END
          cat > src/main/res/drawable/ic_launcher_background.xml <<'END'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2B2B2B" android:pathData="M0,0h108v108h-108z" />
          </vector>
          END
          cat > src/main/res/drawable/ic_launcher_foreground.xml <<'END'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <group android:pivotX="54" android:pivotY="54" android:rotation="22">
                  <path android:strokeColor="#FFFFFF" android:strokeWidth="2.5"
                      android:pathData="M46,26h16a6,6 0 0 1 6,6v44a6,6 0 0 1 -6,6h-16a6,6 0 0 1 -6,-6v-44a6,6 0 0 1 6,-6z" />
              </group>
              <path android:fillColor="#FF3D00" android:pathData="M24,52.5h60v3h-60z" />
          </vector>
          END
          cat > src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'END'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          END
          cat > src/main/res/mipmap-anydpi/ic_launcher.xml <<'END'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_launcher_background" />
              <item android:drawable="@drawable/ic_launcher_foreground" />
          </layer-list>
          END
          cat > src/main/java/com/example/anglelevel/MainActivity.kt <<'END'
          package com.example.anglelevel

          import android.animation.ValueAnimator
          import android.app.Activity
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import kotlin.math.abs
          import kotlin.math.atan2
          import kotlin.math.hypot
          import kotlin.math.roundToInt

          class MainActivity : Activity(), SensorEventListener {
              private lateinit var sm: SensorManager
              private lateinit var view: LevelView
              private var ax = 0f
              private var ay = 0f
              private var shown: Float? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  sm = getSystemService(SENSOR_SERVICE) as SensorManager
                  view = LevelView(this)
                  setContentView(view)
              }

              override fun onResume() {
                  super.onResume()
                  sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let {
                      sm.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME)
                  }
              }

              override fun onPause() {
                  super.onPause()
                  sm.unregisterListener(this)
              }

              override fun onSensorChanged(e: SensorEvent) {
                  val k = 0.06f
                  ax += k * (e.values[0] - ax)
                  ay += k * (e.values[1] - ay)
                  if (hypot(ax, ay) < 3f) {
                      shown = null
                      view.update(null, null)
                      return
                  }
                  val theta = Math.toDegrees(atan2(ax.toDouble(), ay.toDouble()))
                  val dev = (theta - (theta / 90.0).roundToInt() * 90.0).toFloat()
                  val s = shown
                  if (abs(dev) < 0.1f) {
                      shown = 0f
                  } else if (s == null || abs(dev - s) >= 0.15f) {
                      shown = (dev * 10).roundToInt() / 10f
                  }
                  view.update(theta.toFloat(), shown)
              }

              override fun onAccuracyChanged(s: Sensor?, accuracy: Int) {}
          }

          class LevelView(context: Context) : View(context) {
              private var lineAngle: Float? = null
              private var shown: Float? = null
              private var pulse = 0f
              private var wasLevel = false

              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  strokeCap = Paint.Cap.ROUND
              }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  textAlign = Paint.Align.CENTER
                  textSize = 190f
              }

              init { setBackgroundColor(Color.rgb(43, 43, 43)) }

              fun update(line: Float?, value: Float?) {
                  lineAngle = line
                  shown = value
                  val level = value != null && value == 0f
                  if (level && !wasLevel) {
                      val an = ValueAnimator.ofFloat(0f, 1f, 0f)
                      an.duration = 400
                      an.addUpdateListener {
                          pulse = it.animatedValue as Float
                          invalidate()
                      }
                      an.start()
                  }
                  wasLevel = level
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val a = lineAngle
                  val v = shown
                  val c = if (a == null) Color.rgb(100, 100, 100) else Color.rgb(255, 61, 0)
                  linePaint.color = c
                  linePaint.strokeWidth = 4f + 6f * pulse
                  textPaint.color = c
                  canvas.save()
                  canvas.rotate(a ?: 0f, w / 2, h / 2)
                  val half = hypot(w, h)
                  canvas.drawLine(w / 2 - half, h / 2, w / 2 + half, h / 2, linePaint)
                  canvas.restore()
                  if (a != null && v != null) {
                      val text = String.format("%.1f°", v)
                      val sc = 1f + 0.15f * pulse
                      canvas.save()
                      canvas.rotate(a, w / 2, h / 2)
                      canvas.scale(sc, sc, w / 2, h / 2 - 100f)
                      canvas.drawText(text, w / 2, h / 2 - 40f, textPaint)
                      canvas.restore()
                  }
              }
          }
          END
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Level-apk
          path: build/outputs/apk/debug/*.apk
